name: Predator Notification Parity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/predator_notification_parity_audit.py'
      - '.github/workflows/predator-notification-parity.yml'

permissions:
  contents: read

jobs:
  parity:
    name: Read-only shadow-vs-legacy notification parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run parity audit on VPS without touching repo checkout
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            echo 'audit_sha=${{ github.sha }}'
            docker inspect --format='backend_health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' xauusd-backend
            curl -fsSL \
              'https://raw.githubusercontent.com/anutey-cell/eurusd-dashboard/${{ github.sha }}/backend/scripts/predator_notification_parity_audit.py' \
              -o /tmp/predator_notification_parity_audit.py
            docker cp /tmp/predator_notification_parity_audit.py xauusd-backend:/tmp/predator_notification_parity_audit.py
            docker exec -e PYTHONPATH=/app -w /app xauusd-backend \
              python /tmp/predator_notification_parity_audit.py
            rm -f /tmp/predator_notification_parity_audit.py
            docker exec xauusd-backend rm -f /tmp/predator_notification_parity_audit.py || true
