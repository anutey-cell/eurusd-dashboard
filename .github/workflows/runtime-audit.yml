name: Takeover Runtime Audit

on:
  workflow_dispatch:
  push:
    branches:
      - 'chatgpt/takeover-safety-audit'
    paths:
      - '.github/workflows/runtime-audit.yml'

permissions:
  contents: read

jobs:
  vps-runtime-audit:
    name: Read-only VPS runtime audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect full-session alert decisions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /opt/xauusd
            echo '=== ALERT DECISIONS LAST 12H ==='
            docker logs --since 12h xauusd-backend 2>&1 | grep -Ei 'alert fired|alert suppressed|alert SUPPRESSED|watchlist alert|momentum alert|PRIMARY Telegram|Telegram send' | tail -n 1200 || true
            echo '=== DONE ==='
