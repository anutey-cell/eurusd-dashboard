name: Engine C0 Remediation Patcher

on:
  push:
    branches:
      - 'chatgpt/engine-resolution-c0-c1'
    paths:
      - '.github/workflows/engine-resolution-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/engine-resolution-c0-c1
          fetch-depth: 0

      - name: Apply C0 timestamp follow-up
        run: python .github/scripts/engine_c0_followup.py

      - name: Validate patched Python syntax
        run: |
          python -m py_compile backend/services/canonical_market_data.py
          python -m py_compile backend/services/data_freshness.py

      - name: Commit remediation
        run: |
          git config user.name "ChatGPT Engine Agent"
          git config user.email "actions@users.noreply.github.com"
          git add backend/services/canonical_market_data.py backend/services/data_freshness.py
          git commit -m "fix(data): normalize ISO candle timestamps"
          git push origin HEAD:chatgpt/engine-resolution-c0-c1
