name: Gold Runtime Diagnostic

on:
  push:
    branches:
      - 'chatgpt/cme-runtime-verify'
    paths:
      - '.github/workflows/cme-runtime-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose CME snapshot cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            docker exec -i xauusd-backend python - <<'PY'
            import json, os, time, requests
            url = os.getenv('CME_CHATGPT_SNAPSHOT_URL','')
            print('URL', url)
            for label, u in [('plain', url), ('cachebust', url + ('&' if '?' in url else '?') + 't=' + str(int(time.time())) )]:
                r = requests.get(u, timeout=10, headers={'User-Agent':'xauusd-cme-snapshot/diag','Accept':'application/json','Cache-Control':'no-cache'})
                print(label, r.status_code, r.headers.get('age'), r.headers.get('cache-control'))
                try:
                    p = r.json()
                    print(label, p.get('bulletin_date'), p.get('bulletin_status'), p.get('bulletin_number'), len(p.get('options') or []))
                except Exception as e:
                    print(label, 'json_error', type(e).__name__, str(e))
            PY
