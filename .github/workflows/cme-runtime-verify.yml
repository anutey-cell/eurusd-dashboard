name: Gold Runtime Diagnostic

on:
  push:
    branches:
      - 'chatgpt/cme-runtime-verify'
    paths:
      - '.github/workflows/cme-runtime-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live CME zones
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            docker exec -i xauusd-backend python - <<'PY'
            import json
            from database import SessionLocal
            from services.cme_options_context import refresh_chatgpt_snapshot, get_cme_options_context
            refresh_chatgpt_snapshot()
            with SessionLocal() as db:
                ctx = get_cme_options_context(db)
                keep = {k:ctx.get(k) for k in (
                    'status','source','bulletin_date','bulletin_status','age_days',
                    'gc_price','xau_price','gc_xau_basis','basis_status','directional_bias',
                    'gamma_status','zone_count','strongest_zones','nearest_zones','largest_oi_changes'
                )}
                print(json.dumps(keep, indent=2, default=str, sort_keys=True))
            PY
