name: Gold Runtime Diagnostic

on:
  push:
    branches:
      - 'chatgpt/cme-runtime-verify'
    paths:
      - '.github/workflows/cme-runtime-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live CME snapshot pickup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            docker exec -i xauusd-backend python - <<'PY'
            import json
            from database import SessionLocal
            from services.cme_options_context import refresh_chatgpt_snapshot, get_chatgpt_snapshot_status, get_cme_options_context
            refresh_chatgpt_snapshot()
            print('SNAPSHOT_STATUS')
            print(json.dumps(get_chatgpt_snapshot_status(), indent=2, default=str, sort_keys=True))
            with SessionLocal() as db:
                ctx = get_cme_options_context(db)
                keep = {
                    'status': ctx.get('status'),
                    'source': ctx.get('source'),
                    'bulletin_date': ctx.get('bulletin_date'),
                    'bulletin_status': ctx.get('bulletin_status'),
                    'age_days': ctx.get('age_days'),
                    'basis': ctx.get('basis'),
                    'gc_price': ctx.get('gc_price'),
                    'xau_price': ctx.get('xau_price'),
                    'zones': ctx.get('zones'),
                    'directional_bias': ctx.get('directional_bias'),
                    'gamma_status': ctx.get('gamma_status'),
                }
                print('CME_CONTEXT')
                print(json.dumps(keep, indent=2, default=str, sort_keys=True))
            PY
