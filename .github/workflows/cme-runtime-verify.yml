name: C0 Runtime Verify

on:
  push:
    branches:
      - 'chatgpt/cme-runtime-verify'
    paths:
      - '.github/workflows/cme-runtime-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify C0 market-data remediation on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            echo '=== CONTAINER ==='
            docker inspect --format='image={{.Config.Image}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} started={{.State.StartedAt}}' xauusd-backend
            sleep 10

            echo '=== MARKET HEALTH ==='
            docker exec -i xauusd-backend python - <<'PY'
            import json, urllib.request
            with urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=10) as r:
                h = json.load(r)
            m = h.get('market_data') or {}
            out = {
                'overall_status': h.get('status'),
                'broker_execution_enabled': h.get('broker_execution_enabled'),
                'market_status': m.get('status'),
                'data_quality_score': m.get('data_quality_score'),
                'stale_timeframes': m.get('stale_timeframes'),
                'active_provider': m.get('active_provider'),
                'provider_by_timeframe': m.get('provider_by_timeframe'),
                'provider_health': m.get('provider_health'),
                'last_ingest_error': m.get('last_ingest_error'),
            }
            print(json.dumps(out, indent=2, sort_keys=True))
            if out['market_status'] not in ('fresh','degraded'):
                raise SystemExit(f"market data not operational: {out['market_status']}")
            if int(out['data_quality_score'] or 0) < 70:
                raise SystemExit(f"market quality below core threshold: {out['data_quality_score']}")
            PY

            echo '=== ACTIONABILITY + CANONICAL ATTRIBUTION ==='
            docker exec -i xauusd-backend python - <<'PY'
            import json
            from database import SessionLocal
            from services.actionability_gate import evaluate_db_actionability
            from services.canonical_market_data import get_canonical
            with SessionLocal() as db:
                gate = evaluate_db_actionability(db)
                snap = get_canonical(cache_ttl_s=0).snapshot(db, force_refresh=True)
                out = {
                    'gate': gate,
                    'tick_source': snap.tick_source,
                    'data_quality_score': snap.data_quality_score,
                    'tf_sources': {tf: sl.source for tf, sl in snap.timeframes.items()},
                    'tf_status': {tf: sl.status for tf, sl in snap.timeframes.items()},
                }
            print(json.dumps(out, indent=2, sort_keys=True))
            if not out['gate'].get('actionable'):
                raise SystemExit(f"core gate unexpectedly blocked: {out['gate'].get('reason')}")
            if out['gate'].get('optional_context_is_gate') is not False:
                raise SystemExit('optional context incorrectly configured as signal gate')
            if out['tick_source'] == 'twelvedata-derived':
                raise SystemExit('legacy misleading canonical source label remains')
            PY

            echo '=== EXECUTION SAFETY ==='
            docker exec -i xauusd-backend python - <<'PY'
            import json
            from config import settings
            out = {
                'broker_execution_enabled': bool(getattr(settings,'broker_execution_enabled',False)),
                'live_trading_authorized': bool(getattr(settings,'live_trading_authorized',False)),
                'auto_execution_enabled': bool(getattr(settings,'auto_execution_enabled',False)),
                'predator_execution_enabled': bool(getattr(settings,'predator_execution_enabled',False)),
            }
            print(json.dumps(out, sort_keys=True))
            if any(out.values()):
                raise SystemExit(f'execution safety regression: {out}')
            PY
