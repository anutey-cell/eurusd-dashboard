name: CME Runtime Verify

on:
  push:
    branches:
      - 'chatgpt/cme-runtime-verify'
    paths:
      - '.github/workflows/cme-runtime-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify CME HOME relay on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            echo '=== CONTAINER ==='
            docker inspect --format='status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} started={{.State.StartedAt}}' xauusd-backend

            echo '=== HEALTH / CME OPTIONS ==='
            docker exec -i xauusd-backend python - <<'PY'
            import json, urllib.request
            with urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=10) as r:
                h = json.load(r)
            c = h.get('cme_options') or {}
            print(json.dumps({
                'status': h.get('status'),
                'broker_execution_enabled': h.get('broker_execution_enabled'),
                'cme_status': c.get('status'),
                'bulletin_date': c.get('bulletin_date'),
                'age_days': c.get('age_days'),
                'gc_xau_basis': c.get('gc_xau_basis'),
                'acquisition': c.get('acquisition'),
            }, indent=2, sort_keys=True))
            PY

            echo '=== RELAY ENDPOINT AUTH ==='
            docker exec -i xauusd-backend python - <<'PY'
            import json
            import urllib.error
            import urllib.request
            from config import settings

            url = 'http://127.0.0.1:8000/api/v1/cme/bulletin-relay'
            body = json.dumps({
                'source': 'runtime-verifier',
                'options_pdf_b64': 'A' * 1200,
                'futures_pdf_b64': 'A' * 1200,
            }).encode()

            def post(secret=None):
                headers = {'Content-Type': 'application/json'}
                if secret is not None:
                    headers['X-Bridge-Secret'] = secret
                req = urllib.request.Request(url, data=body, headers=headers, method='POST')
                try:
                    with urllib.request.urlopen(req, timeout=10) as r:
                        return r.status, r.read().decode()[:300]
                except urllib.error.HTTPError as e:
                    return e.code, e.read().decode()[:300]

            missing = post()
            authenticated = post((settings.mt5_bridge_shared_secret or '').strip())
            print(json.dumps({
                'missing_secret_status': missing[0],
                'authenticated_invalid_pdf_status': authenticated[0],
            }, sort_keys=True))
            if missing[0] != 401:
                raise SystemExit(f'expected 401 without bridge secret, got {missing}')
            if authenticated[0] != 422:
                raise SystemExit(f'expected 422 after auth for invalid payload, got {authenticated}')
            PY

            echo '=== CME CLOUD WORKER / EXECUTION SAFETY ==='
            docker exec -i xauusd-backend python - <<'PY'
            import json, os
            from config import settings
            out = {
                'cme_direct_cloud_refresh_enabled': os.getenv('CME_OPTIONS_CONTEXT_REFRESH_ENABLED'),
                'broker_execution_enabled': bool(getattr(settings,'broker_execution_enabled',False)),
                'live_trading_authorized': bool(getattr(settings,'live_trading_authorized',False)),
            }
            print(json.dumps(out, sort_keys=True))
            if str(out['cme_direct_cloud_refresh_enabled']).lower() != 'false':
                raise SystemExit('direct CME cloud worker must be disabled in production')
            if out['broker_execution_enabled'] or out['live_trading_authorized']:
                raise SystemExit('execution safety regression')
            PY
