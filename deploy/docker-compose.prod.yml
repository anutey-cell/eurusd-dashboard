# ============================================================================
# XAU/USD Signal Dashboard — Production Compose (Oracle Cloud VPS)
# ============================================================================
# Deploy at /opt/xauusd/ on the VPS. Run with:
#   cd /opt/xauusd
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#
# Differences from the dev docker-compose.yml at repo root:
#   - Backend + frontend ports are NOT published to host (only Caddy is public)
#   - Networks are private; Caddy on host:443 reverse-proxies via Docker network
#   - Caddy runs on host (installed by bootstrap-vm.sh) — NOT containerised here,
#     so cert renewal etc. survives stack restarts
#   - Images are PULLED from Docker Hub (built by GitHub Actions, never on the
#     droplet — keeps the 1 vCPU box from melting). To pin a specific build,
#     set IMAGE_TAG=<short-sha> in the env or workflow. Default = "latest".
#   - SQLite database mounted from /opt/xauusd/data (host volume) for easy backup
#   - .env loaded explicitly via --env-file flag (NOT baked into image)
#   - Healthchecks + restart policies hardened for unattended operation
# ============================================================================

services:

  backend:
    image: anudhe/xauusd-backend:${IMAGE_TAG:-latest}
    pull_policy: always         # always grab the latest digest for IMAGE_TAG
    container_name: xauusd-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"          # internal-only; Caddy proxies on host:443
    env_file:
      - ./.env.prod
    environment:
      - DATABASE_URL=sqlite:////app/storage/eurusd_signals.db
      - DATA_MODE=live

      # ----------------------------------------------------------------------
      # EXECUTION SAFETY — compose is authoritative over stale .env values.
      # Signal/research layers may run, but no strategy is permitted to enqueue
      # or send orders until these are deliberately changed in reviewed code.
      # ----------------------------------------------------------------------
      - BROKER_EXECUTION_ENABLED=false
      - LIVE_TRADING_AUTHORIZED=false
      - AUTO_EXECUTION_ENABLED=false
      - MT5_EXECUTION_ENABLED=false
      - ALLOW_DEMO_TRADING=false
      - DEMO_AUTO_ENQUEUE=false
      - PREDATOR_EXECUTION_ENABLED=false
      - PREDATOR_EXPANSION_ENABLED=false
      - VP_TRAP_AUTO_EXECUTE=false

      # Cloud continuity must work even when the Windows/MT5 bridge is offline.
      # Explicit compose value overrides the provider module's conservative
      # default and permits anonymous OANDA:XAUUSD retrieval via tvDatafeed.
      - TRADINGVIEW_ENABLED=true
      # CME/Akamai currently rejects ordinary hosted/direct bulletin downloads.
      # Keep that direct worker disabled. The primary unattended CME context
      # channel is a validated whole-surface snapshot produced by ChatGPT and
      # published on the dedicated cme-snapshots GitHub branch.
      - CME_OPTIONS_CONTEXT_REFRESH_ENABLED=false
      - CME_CHATGPT_SNAPSHOT_ENABLED=true
      - CME_CHATGPT_SNAPSHOT_URL=https://raw.githubusercontent.com/anutey-cell/eurusd-dashboard/cme-snapshots/cme/latest.json
      - PYTHONUNBUFFERED=1
    volumes:
      - /opt/xauusd/data:/app/storage          # SQLite DB lives on host
      - /opt/xauusd/logs:/app/logs             # Logs accessible from host
    networks:
      - xauusd-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    image: anudhe/xauusd-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: xauusd-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"          # internal-only; Caddy proxies on host:443
    environment:
      # Frontend doesn't talk to backend directly from the browser — Caddy
      # routes /api/* to backend internally. So VITE_API_BASE_URL is just
      # the public origin (Caddy's HTTPS endpoint).
      - VITE_API_BASE_URL=https://${FQDN}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - xauusd-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  xauusd-net:
    driver: bridge
    name: xauusd-net
