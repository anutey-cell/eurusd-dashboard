services:

  backend:
    image: anudhe/eurusd-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data
    environment:
      - DATA_MODE=demo
      - DATABASE_URL=sqlite:////app/data/eurusd_signals.db
      # CORS default already includes localhost:5173 — override only needed for VPS
      # CORS_ORIGINS=["http://yourdomain.com"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: anudhe/eurusd-frontend:latest
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
