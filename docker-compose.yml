services:

  backend:
    image: anudhe/xauusd-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/storage
    env_file:
      - path: ./backend/.env    # loads all secrets (TELEGRAM_*, MT5_*, API keys, etc.)
        required: false         # OK if .env not yet created — copy .env.example to start
    environment:
      # DATA_MODE controlled by backend/.env now (live for 2-week test)
      - DATABASE_URL=sqlite:////app/storage/eurusd_signals.db
      # CORS default already includes localhost:5173 — override only needed for VPS
      # CORS_ORIGINS=["http://yourdomain.com"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: anudhe/xauusd-frontend:latest
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
